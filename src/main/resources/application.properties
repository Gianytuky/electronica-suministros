spring.application.name=multimedia-digital

server.port=${PORT:8083}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/electronica_suministros?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

logging.level.root=INFO

# ======================================================================================
# AVANCE FINAL: CORREO (JavaMailSender) Y RECUPERACIÓN DE CONTRASEÑA
# Las credenciales NUNCA se escriben aquí: se leen de variables de entorno (en Render se
# definen en Environment) o, en localhost, del archivo opcional .env de la raíz del proyecto
# (copie .env.example como .env y complete sus datos; .env está en .gitignore).
# ======================================================================================
spring.config.import=optional:file:./.env[.properties]

# Gmail SMTP por defecto (STARTTLS, puerto 587). MAIL_PASSWORD debe ser una "contraseña de
# aplicación" de Google (16 letras, sin espacios), no la contraseña normal de la cuenta.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Solo para el puerto 465 (SSL directo): MAIL_SSL=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
# SOLO LOCALHOST (antivirus que intercepta el TLS del correo; ver informe XIII.5.3): confia en el certificado
# spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
# de smtp.gmail.com sin validarlo contra cacerts. No subir a GitHub ni usar en Render.
# Tiempos máximos (ms) para que un SMTP caído no deje colgada la aplicación
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# Remitente visible. Con Gmail debe coincidir con la cuenta autenticada (MAIL_USER).
app.mail.from=${MAIL_FROM:${MAIL_USER:}}
# OJO: Spring Boot lee los .properties como ISO-8859-1, por eso la o con tilde se escribe como secuencia
# Unicode (barra invertida + u00f3). Si se escribe la letra directamente, el remitente aparece con caracteres raros.
app.mail.nombre-remitente=Electr\u00f3nica y Suministros S.A.C.

# MODO PRUEBA (solo localhost): si se define, TODOS los correos se envían a esta dirección en lugar de
# al destinatario real. Útil porque los datos de ejemplo traen correos de clientes que parecen reales.
# En producción (Render) debe quedar vacío.
app.mail.redirigir-a=${MAIL_REDIRIGIR_A:}

# URL pública de la aplicación: se usa para armar el enlace del correo de recuperación.
# Local: http://localhost:8083   |   Render: https://electronica-suministros.onrender.com
app.base-url=${APP_BASE_URL:http://localhost:8083}

# Minutos de vigencia del token UUID de recuperación de contraseña
app.recuperacion.token-minutos=${RESET_TOKEN_MINUTOS:15}

# ======================================================================================
# AVANCE FINAL (INTEGRACIONES): APIs EXTERNAS (ApiPeru.dev) Y MICROSERVICIO PYTHON (FastAPI)
# El token de ApiPeru.dev va en APIPERU_TOKEN (.env o Environment de Render), separado de MAIL_*.
# Nunca se escribe el token en el codigo ni en este archivo.
# ======================================================================================
app.apiperu.token=${APIPERU_TOKEN:}
app.apiperu.url-dni=${APIPERU_URL_DNI:https://apiperu.dev/api/dni}
app.apiperu.url-tipo-cambio=${APIPERU_URL_TIPO_CAMBIO:https://apiperu.dev/api/tipo-de-cambio}
app.apiperu.url-ruc=${APIPERU_URL_RUC:https://apiperu.dev/api/ruc}

# Tipo de cambio referencial USD -> PEN: cache en memoria de 6 h (plan gratuito con cuota mensual baja),
# reintento 60 min despues de un fallo y valor de respaldo si la API nunca respondio.
app.tipo-cambio.horas-cache=${TIPO_CAMBIO_HORAS_CACHE:6}
app.tipo-cambio.minutos-reintento=${TIPO_CAMBIO_MINUTOS_REINTENTO:60}
app.tipo-cambio.respaldo=${TIPO_CAMBIO_RESPALDO:3.75}

# Microservicio Python de analisis estadistico (carpeta python-api/). Si no esta levantado,
# Reportes sigue funcionando y solo muestra un aviso discreto.
app.python-api.url=${PYTHON_API_URL:http://localhost:8000}
