<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<!--
  Página de error 400. Spring Boot (BasicErrorController) la muestra automáticamente
  cuando el estado HTTP es 400, porque está en templates/error/400.html.
  No se imprime ninguna traza técnica: solo un mensaje amigable.
-->
<head th:replace="~{fragments/header :: head('Error 400')}"></head>

<body class="d-flex align-items-center justify-content-center py-5"
    style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh;">
    <main class="container text-center text-white">
        <i class="bi bi-exclamation-octagon text-warning" style="font-size: 3.5rem;"></i>
        <div class="display-1 fw-bold text-warning mt-2">400</div>
        <h2 class="fw-bold mt-2">Solicitud incorrecta</h2>
        <p class="text-secondary mx-auto mt-3" style="max-width: 520px;">La solicitud tiene datos que el sistema no pudo interpretar. Revise lo que envió e inténtelo de nuevo.</p>
        <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
            <a th:href="@{/}" class="btn btn-warning fw-semibold"><i class="bi bi-house-door me-2"></i>Ir al inicio</a>
            <a href="javascript:history.back()" class="btn btn-outline-light"><i class="bi bi-arrow-left me-2"></i>Volver</a>
        </div>
    </main>
</body>

</html>
