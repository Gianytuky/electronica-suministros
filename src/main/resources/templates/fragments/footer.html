<!DOCTYPE html>
<!--
  FRAGMENTOS: footer corporativo y scripts comunes.
    footer  -> pie de página (se pega al fondo con mt-auto dentro de un body d-flex flex-column min-vh-100)
    scripts -> Bootstrap JS (bundle con Popper). Se coloca al final del <body>.
-->
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <footer th:fragment="footer" class="bg-dark text-white py-3 border-top border-secondary mt-auto">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">

                <div class="d-flex align-items-center text-warning fw-bold">
                    <i class="bi bi-disc-fill me-2 fs-5"></i>
                    <span>Electrónica y Suministros S.A.C.</span>
                </div>

                <div class="d-flex align-items-center small">
                    <i class="bi bi-envelope-at-fill text-warning me-2"></i>
                    <a href="mailto:Giancarlo_Rivas_MarcosWEB@hotmail.com"
                        class="text-light text-decoration-none fw-semibold">Giancarlo_Rivas_MarcosWEB@hotmail.com</a>
                </div>

                <div class="d-flex align-items-center small">
                    <i class="bi bi-telephone-fill text-warning me-2"></i>
                    <span class="fw-semibold">+51 (01) 998-877-665</span>
                </div>

                <div class="small text-secondary">&copy; 2026 Electrónica y Suministros. Todos los derechos reservados.</div>
            </div>
        </div>
    </footer>

    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </th:block>

</body>

</html>
