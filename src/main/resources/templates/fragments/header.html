<!DOCTYPE html>
<!--
  FRAGMENTOS COMUNES (se reutilizan con th:replace)
    head(titulo)   -> <head> con Bootstrap 5 y Bootstrap Icons (solo CDN, sin CSS ni JS propio)
    header(activo) -> barra de navegación de las páginas públicas
    alertas        -> mensajes "ok" / "error" que envían los controladores con RedirectAttributes
-->
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | Electrónica y Suministros'">Electrónica y Suministros</title>
    <!-- Avance final (Spring Security): token CSRF para las peticiones fetch que modifican datos -->
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

    <!-- ============ NAVEGACIÓN PÚBLICA ============ -->
    <header th:fragment="header(activo)">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm mb-4">
            <div class="container">
                <a class="navbar-brand fw-bold text-warning" th:href="@{/}">
                    <i class="bi bi-disc-fill me-2"></i>Electrónica y Suministros
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPublico"
                    aria-label="Mostrar menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPublico">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${activo == 'inicio'} ? 'active fw-semibold'"
                                th:href="@{/}">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${activo == 'servicios'} ? 'active fw-semibold'"
                                th:href="@{/servicios}">Catálogo y Precios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${activo == 'contacto'} ? 'active fw-semibold'"
                                th:href="@{/contacto}">Contacto</a>
                        </li>
                    </ul>

                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <!-- Avance final (integraciones): tipo de cambio referencial de ApiPeru.dev
                             (TipoCambioService lo guarda 6 h en memoria; si la API falla usa el último valor o el de respaldo) -->
                        <span class="badge text-bg-light border px-2 py-2 fw-normal" th:with="tc=${@tipoCambioService.actual()}"
                            th:title="${tc.respaldo} ? 'Valor de respaldo: ApiPeru.dev no estuvo disponible' : 'Tipo de cambio referencial del ' + ${tc.fecha} + ' (ApiPeru.dev)'">
                            <i class="bi bi-currency-exchange me-1"></i>USD
                            <span th:text="'compra S/ ' + ${#numbers.formatDecimal(tc.compra, 1, 'COMMA', 3, 'POINT')} + ' · venta S/ ' + ${#numbers.formatDecimal(tc.venta, 1, 'COMMA', 3, 'POINT')}">compra S/ 3.740 · venta S/ 3.750</span>
                            <span class="text-muted" th:if="${tc.respaldo}">(respaldo)</span>
                        </span>
                        <!-- Sin sesión -->
                        <a th:if="${session.usuario == null}" th:href="@{/login}"
                            class="btn btn-outline-light btn-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sesión
                        </a>
                        <!-- Con sesión: acceso directo al panel de su rol -->
                        <th:block th:if="${session.usuario != null}">
                            <span class="badge bg-secondary px-2 py-2">
                                <i class="bi bi-person-circle me-1"></i><span
                                    th:text="${session.usuario.nombres}">Usuario</span>
                            </span>
                            <a th:href="@{${session.usuario.rol == 'ADMIN' ? '/admin/dashboard' : (session.usuario.rol == 'EJECUTIVO' ? '/ejecutivo/ordenes' : '/tecnico/panel')}}"
                                class="btn btn-warning btn-sm fw-semibold">
                                <i class="bi bi-speedometer2 me-1"></i>Mi panel
                            </a>
                            <!-- Spring Security: el cierre de sesión es POST con token CSRF -->
                            <form th:action="@{/logout}" method="post" class="d-inline m-0">
                                <button type="submit" class="btn btn-outline-danger btn-sm" title="Cerrar sesión">
                                    <i class="bi bi-box-arrow-right"></i>
                                </button>
                            </form>
                        </th:block>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- ============ MENSAJES FLASH ============ -->
    <div th:fragment="alertas">
        <div th:if="${ok}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${ok}">Operación realizada.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Ocurrió un error.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
    </div>

</body>

</html>
