<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/header :: head('Categorías')}"></head>

<body class="bg-light">
    <div class="d-flex">
        <th:block th:replace="~{fragments/sidebar :: sidebar('categorias')}"></th:block>

        <main class="flex-grow-1 p-4 overflow-auto" style="height: 100vh;">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
                <div>
                    <h2 class="fw-bold mb-0"><i class="bi bi-collection text-info me-2"></i>Categorías de material</h2>
                    <small class="text-muted">Video, Audio e Imagen. Una categoría agrupa muchos servicios del tarifario (relación 1 a N).</small>
                </div>
                <button type="button" class="btn btn-info fw-semibold" onclick="nuevaCategoria()">
                    <i class="bi bi-plus-circle me-1"></i>Nueva categoría
                </button>
            </div>

            <div th:replace="~{fragments/header :: alertas}"></div>

            <div class="card shadow-sm border-0 rounded-4">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark small">
                            <tr>
                                <th></th>
                                <th>Categoría</th>
                                <th>Descripción</th>
                                <th class="text-center">Servicios</th>
                                <th class="text-center">Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${categorias}">
                                <td style="width: 70px;">
                                    <img th:src="@{'/assets/img/' + ${c.imagen}}" th:alt="${c.nombreCategoria}" width="56" height="44"
                                        class="rounded border" style="object-fit: cover;">
                                </td>
                                <td class="fw-semibold" th:text="${c.nombreCategoria}">Video</td>
                                <td class="small text-muted" th:text="${c.descripcion}">Descripción</td>
                                <td class="text-center"><span class="badge bg-info text-dark" th:text="${#lists.size(c.servicios)}">0</span></td>
                                <td class="text-center">
                                    <span class="badge" th:classappend="${c.estado == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'" th:text="${c.estado}">ACTIVO</span>
                                </td>
                                <td class="text-center text-nowrap">
                                    <button type="button" class="btn btn-sm btn-outline-primary" title="Editar"
                                        th:data-id="${c.idCategoria}" th:data-nombre="${c.nombreCategoria}"
                                        th:data-descripcion="${c.descripcion}" th:data-imagen="${c.imagen}"
                                        th:data-estado="${c.estado}" onclick="editarCategoria(this)">
                                        <i class="bi bi-pencil-square"></i></button>
                                    <form th:action="@{/admin/categorias/eliminar/{id}(id=${c.idCategoria})}" method="post" class="d-inline"
                                        onsubmit="return confirm('¿Eliminar esta categoría? Solo es posible si no tiene servicios.');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                            <i class="bi bi-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal fade" id="modalCategoria" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" th:action="@{/admin/categorias/guardar}" method="post">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="tituloModalCategoria">Nueva categoría</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="idCategoria" id="fId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre *</label>
                        <input type="text" name="nombreCategoria" id="fNombre" class="form-control" maxlength="50" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Descripción</label>
                        <textarea name="descripcion" id="fDescripcion" class="form-control" rows="3" maxlength="200"></textarea>
                    </div>
                    <div class="row g-3">
                        <div class="col-7">
                            <label class="form-label fw-semibold">Imagen</label>
                            <input type="text" name="imagen" id="fImagen" class="form-control" maxlength="80" placeholder="video-card.jpg">
                        </div>
                        <div class="col-5">
                            <label class="form-label fw-semibold">Estado</label>
                            <select name="estado" id="fEstado" class="form-select">
                                <option value="ACTIVO">ACTIVO</option>
                                <option value="INACTIVO">INACTIVO</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-info fw-semibold"><i class="bi bi-save me-1"></i>Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <th:block th:replace="~{fragments/footer :: scripts}"></th:block>
    <script>
        const modalCategoria = new bootstrap.Modal(document.getElementById('modalCategoria'));

        function nuevaCategoria() {
            document.getElementById('tituloModalCategoria').textContent = 'Nueva categoría';
            ['fId', 'fNombre', 'fDescripcion', 'fImagen'].forEach(function (i) { document.getElementById(i).value = ''; });
            document.getElementById('fEstado').value = 'ACTIVO';
            modalCategoria.show();
        }

        function editarCategoria(btn) {
            const d = btn.dataset;
            document.getElementById('tituloModalCategoria').textContent = 'Editar categoría';
            document.getElementById('fId').value = d.id;
            document.getElementById('fNombre').value = d.nombre;
            document.getElementById('fDescripcion').value = d.descripcion || '';
            document.getElementById('fImagen').value = d.imagen || '';
            document.getElementById('fEstado').value = d.estado;
            modalCategoria.show();
        }
    </script>
</body>

</html>
