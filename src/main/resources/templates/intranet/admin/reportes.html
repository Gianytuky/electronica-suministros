<!DOCTYPE html>
<!--
  Avance final (integraciones): la interfaz analítica de Reportes es una mini-aplicación React + Vite
  (carpeta frontend-reportes/). "npm run build" la compila hacia src/main/resources/static/react-reportes/,
  y Spring Boot la sirve como recurso estático. Esta plantilla conserva el layout de la intranet (sidebar)
  y la seguridad: /admin/reportes y /api/reportes/** siguen protegidos por AuthInterceptor (solo ADMIN).
  La app consume /api/reportes/ventas-mensuales, /api/reportes/formatos y /api/reportes/analisis (Python).
-->
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/header :: head('Reportes de ventas')}"></head>

<body class="bg-light">
    <div class="d-flex">
        <th:block th:replace="~{fragments/sidebar :: sidebar('reportes')}"></th:block>

        <main class="flex-grow-1 p-4 overflow-auto" style="height: 100vh;">
            <!-- Punto de montaje de React: los años del selector vienen de ReporteService.aniosDisponibles() -->
            <div id="root" th:data-anios="${#strings.listJoin(anios, ',')}" th:data-anio="${anio}">
                <div class="text-center text-muted py-5" id="msgCargaReportes">
                    <div class="spinner-border text-warning mb-3" role="status"></div>
                    <div>Cargando reportes...</div>
                </div>
            </div>
        </main>
    </div>

    <th:block th:replace="~{fragments/footer :: scripts}"></th:block>
    <script type="module" th:src="@{/react-reportes/assets/reportes.js}"
        onerror="document.getElementById('msgCargaReportes').innerHTML = '<div class=&quot;alert alert-warning d-inline-block&quot;>No se encontró la aplicación de reportes compilada. Ejecute <code>npm install</code> y <code>npm run build</code> en la carpeta <code>frontend-reportes/</code> y reinicie la aplicación.</div>';"></script>
</body>

</html>
