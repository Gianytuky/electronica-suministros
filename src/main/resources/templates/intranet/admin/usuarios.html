<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/header :: head('Usuarios')}"></head>

<body class="bg-light">
    <div class="d-flex">
        <th:block th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></th:block>

        <main class="flex-grow-1 p-4 overflow-auto" style="height: 100vh;">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
                <div>
                    <h2 class="fw-bold mb-0"><i class="bi bi-person-gear text-info me-2"></i>Usuarios del sistema</h2>
                    <small class="text-muted">Cada usuario pertenece a un rol (relación @ManyToOne con la tabla rol). Las contraseñas se guardan cifradas (BCrypt).</small>
                </div>
                <button type="button" class="btn btn-info fw-semibold" onclick="nuevoUsuario()">
                    <i class="bi bi-person-plus me-1"></i>Nuevo usuario
                </button>
            </div>

            <div th:replace="~{fragments/header :: alertas}"></div>

            <div class="card shadow-sm border-0 rounded-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Nombres</th>
                                <th>Correo</th>
                                <th class="text-center">Rol</th>
                                <th class="text-center">Estado</th>
                                <th>Registro</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${usuarios}">
                                <td class="fw-semibold" th:text="${u.nombres}">Nombre</td>
                                <td th:text="${u.correo}">correo</td>
                                <td class="text-center">
                                    <span class="badge"
                                        th:classappend="${u.rol.nombreRol == 'ADMIN'} ? 'bg-danger' : (${u.rol.nombreRol == 'EJECUTIVO'} ? 'bg-warning text-dark' : 'bg-info text-dark')"
                                        th:text="${u.rol.nombreRol}">ADMIN</span>
                                </td>
                                <td class="text-center">
                                    <span class="badge" th:classappend="${u.estado == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'"
                                        th:text="${u.estado}">ACTIVO</span>
                                </td>
                                <td th:text="${#temporals.format(u.fechaRegistro, 'dd/MM/yyyy')}">01/10/2026</td>
                                <td class="text-center text-nowrap">
                                    <button type="button" class="btn btn-sm btn-outline-primary" title="Editar"
                                        th:data-id="${u.idUsuario}" th:data-nombres="${u.nombres}"
                                        th:data-correo="${u.correo}" th:data-rol="${u.rol.idRol}"
                                        th:data-estado="${u.estado}" onclick="editarUsuario(this)">
                                        <i class="bi bi-pencil-square"></i></button>
                                    <form th:action="@{/admin/usuarios/eliminar/{id}(id=${u.idUsuario})}" method="post"
                                        class="d-inline"
                                        onsubmit="return confirm('¿Eliminar este usuario? Si tiene OTs o capturas solo se desactivará.');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                            <i class="bi bi-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" th:action="@{/admin/usuarios/guardar}" method="post">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="tituloModal">Nuevo usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="idUsuario" id="fId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombres *</label>
                        <input type="text" name="nombres" id="fNombres" class="form-control" maxlength="80" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Correo *</label>
                        <input type="email" name="correo" id="fCorreo" class="form-control" maxlength="100" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Contraseña <span id="avisoClave" class="text-muted fw-normal">*</span></label>
                        <input type="password" name="password" id="fPassword" class="form-control" minlength="3" maxlength="50">
                        <div class="form-text" id="ayudaClave">Mínimo 3 caracteres.</div>
                    </div>
                    <div class="row g-3">
                        <div class="col-7">
                            <label class="form-label fw-semibold">Rol *</label>
                            <select name="idRol" id="fRol" class="form-select" required>
                                <option th:each="r : ${roles}" th:value="${r.idRol}"
                                    th:text="${r.nombreRol + ' - ' + r.descripcion}">ADMIN</option>
                            </select>
                        </div>
                        <div class="col-5">
                            <label class="form-label fw-semibold">Estado</label>
                            <select name="estado" id="fEstado" class="form-select">
                                <option value="ACTIVO">ACTIVO</option>
                                <option value="INACTIVO">INACTIVO</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary fw-semibold"><i class="bi bi-save me-1"></i>Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <th:block th:replace="~{fragments/footer :: scripts}"></th:block>
    <script>
        const modalUsuario = new bootstrap.Modal(document.getElementById('modalUsuario'));

        function nuevoUsuario() {
            document.getElementById('tituloModal').textContent = 'Nuevo usuario';
            ['fId', 'fNombres', 'fCorreo', 'fPassword'].forEach(function (i) { document.getElementById(i).value = ''; });
            document.getElementById('fPassword').required = true;
            document.getElementById('ayudaClave').textContent = 'Mínimo 3 caracteres.';
            document.getElementById('fRol').selectedIndex = 0;
            document.getElementById('fEstado').value = 'ACTIVO';
            modalUsuario.show();
        }

        function editarUsuario(btn) {
            const d = btn.dataset;
            document.getElementById('tituloModal').textContent = 'Editar usuario';
            document.getElementById('fId').value = d.id;
            document.getElementById('fNombres').value = d.nombres;
            document.getElementById('fCorreo').value = d.correo;
            document.getElementById('fPassword').value = '';
            document.getElementById('fPassword').required = false;
            document.getElementById('ayudaClave').textContent = 'Déjela vacía para conservar la contraseña actual.';
            document.getElementById('fRol').value = d.rol;
            document.getElementById('fEstado').value = d.estado;
            modalUsuario.show();
        }
    </script>
</body>

</html>
