<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/header :: head('Clientes')}"></head>

<body class="bg-light">
    <div class="d-flex">
        <th:block th:replace="~{fragments/sidebar :: sidebar('clientes')}"></th:block>

        <main class="flex-grow-1 p-4 overflow-auto" style="height: 100vh;">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
                <div>
                    <h2 class="fw-bold mb-0"><i class="bi bi-people text-primary me-2"></i>Clientes</h2>
                    <small class="text-muted">Mantenimiento completo: registrar, buscar, editar y eliminar. Cada cliente puede tener muchas órdenes de trabajo.</small>
                </div>
                <button type="button" class="btn btn-primary fw-semibold" onclick="nuevoCliente()">
                    <i class="bi bi-person-plus me-1"></i>Nuevo cliente
                </button>
            </div>

            <div th:replace="~{fragments/header :: alertas}"></div>

            <form th:action="@{/ejecutivo/clientes}" method="get" class="card shadow-sm border-0 rounded-4 mb-4">
                <div class="card-body">
                    <div class="input-group">
                        <input type="text" name="texto" class="form-control" th:value="${texto}"
                            placeholder="Buscar por nombre o por DNI / RUC">
                        <button class="btn btn-primary" type="submit"><i class="bi bi-search me-1"></i>Buscar</button>
                        <a th:href="@{/ejecutivo/clientes}" class="btn btn-outline-secondary">Limpiar</a>
                    </div>
                </div>
            </form>

            <div class="card shadow-sm border-0 rounded-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>DNI / RUC</th>
                                <th>Nombres / Razón social</th>
                                <th>Teléfono</th>
                                <th>Correo</th>
                                <th class="text-center">OTs</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${clientes}">
                                <td>
                                    <span class="badge bg-secondary me-1" th:text="${#strings.length(c.dniCliente) == 11} ? 'RUC' : 'DNI'">DNI</span>
                                    <span th:text="${c.dniCliente}">70000001</span>
                                </td>
                                <td class="fw-semibold" th:text="${c.nombres}">Nombre</td>
                                <td th:text="${c.telefono} ?: '—'">999</td>
                                <td th:text="${c.correo} ?: '—'">correo</td>
                                <td class="text-center"><span class="badge bg-info text-dark"
                                        th:text="${#lists.size(c.ordenes)}">0</span></td>
                                <td class="text-center text-nowrap">
                                    <button type="button" class="btn btn-sm btn-outline-primary" title="Editar"
                                        th:data-id="${c.idCliente}" th:data-doc="${c.dniCliente}"
                                        th:data-nombres="${c.nombres}" th:data-telefono="${c.telefono}"
                                        th:data-correo="${c.correo}" onclick="editarCliente(this)">
                                        <i class="bi bi-pencil-square"></i></button>
                                    <form th:action="@{/ejecutivo/clientes/eliminar/{id}(id=${c.idCliente})}" method="post"
                                        class="d-inline"
                                        onsubmit="return confirm('¿Eliminar este cliente? Solo es posible si no tiene órdenes de trabajo.');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                            <i class="bi bi-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(clientes)}">
                                <td colspan="6" class="text-center text-muted py-4">No se encontraron clientes.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL: alta y edición -->
    <div class="modal fade" id="modalCliente" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <form class="modal-content" th:action="@{/ejecutivo/clientes/guardar}" method="post">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="tituloModalCliente">Nuevo cliente</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="idCliente" id="fId">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-semibold">DNI (8 dígitos) o RUC (11 dígitos) *</label>
                            <input type="text" name="dniCliente" id="fDoc" class="form-control" maxlength="11"
                                pattern="[0-9]{8}|[0-9]{11}" title="8 dígitos (DNI) u 11 dígitos (RUC)" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Nombres o razón social *</label>
                            <input type="text" name="nombres" id="fNombres" class="form-control" maxlength="100" required>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label fw-semibold">Teléfono</label>
                            <input type="text" name="telefono" id="fTelefono" class="form-control" maxlength="20">
                        </div>
                        <div class="col-md-7">
                            <label class="form-label fw-semibold">Correo</label>
                            <input type="email" name="correo" id="fCorreo" class="form-control" maxlength="100">
                        </div>
                        </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary fw-semibold"><i class="bi bi-save me-1"></i>Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <th:block th:replace="~{fragments/footer :: scripts}"></th:block>
    <script>
        const modalCliente = new bootstrap.Modal(document.getElementById('modalCliente'));

        function nuevoCliente() {
            document.getElementById('tituloModalCliente').textContent = 'Nuevo cliente';
            ['fId', 'fDoc', 'fNombres', 'fTelefono', 'fCorreo'].forEach(function (i) { document.getElementById(i).value = ''; });
            modalCliente.show();
        }

        function editarCliente(btn) {
            const d = btn.dataset;
            document.getElementById('tituloModalCliente').textContent = 'Editar cliente';
            document.getElementById('fId').value = d.id;
            document.getElementById('fDoc').value = d.doc;
            document.getElementById('fNombres').value = d.nombres;
            document.getElementById('fTelefono').value = d.telefono || '';
            document.getElementById('fCorreo').value = d.correo || '';
            modalCliente.show();
        }
    </script>
</body>

</html>
