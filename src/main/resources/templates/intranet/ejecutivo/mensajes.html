<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/header :: head('Bandeja de consultas')}"></head>

<body class="bg-light">
    <div class="d-flex">
        <th:block th:replace="~{fragments/sidebar :: sidebar('mensajes')}"></th:block>

        <main class="flex-grow-1 p-4 overflow-auto" style="height: 100vh;">

            <div class="mb-4">
                <h2 class="fw-bold mb-0"><i class="bi bi-inbox text-warning me-2"></i>Bandeja de consultas</h2>
                <small class="text-muted">Mensajes enviados desde el formulario público de contacto.</small>
            </div>

            <div th:replace="~{fragments/header :: alertas}"></div>

            <form th:action="@{/ejecutivo/mensajes}" method="get" class="card shadow-sm border-0 rounded-4 mb-4">
                <div class="card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Desde</label>
                            <input type="date" name="desde" class="form-control" th:value="${desde}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Hasta</label>
                            <input type="date" name="hasta" class="form-control" th:value="${hasta}">
                        </div>
                        <div class="col-md-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill"><i class="bi bi-funnel me-1"></i>Filtrar</button>
                            <a th:href="@{/ejecutivo/mensajes}" class="btn btn-outline-secondary flex-fill">Limpiar</a>
                        </div>
                    </div>
                </div>
            </form>

            <div class="card shadow-sm border-0 rounded-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Fecha</th>
                                <th>Remitente</th>
                                <th>Mensaje</th>
                                <th class="text-center">Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${mensajes}">
                                <td class="text-nowrap" th:text="${#temporals.format(m.fechaEnvio, 'dd/MM/yyyy HH:mm')}">01/10/2026</td>
                                <td>
                                    <div class="fw-semibold" th:text="${m.nombre}">Nombre</div>
                                    <small class="text-muted" th:text="${m.correo}">correo</small>
                                </td>
                                <td style="max-width: 380px;">
                                    <span class="d-inline-block text-truncate" style="max-width: 360px;"
                                        th:text="${m.mensaje}">Mensaje</span>
                                </td>
                                <td class="text-center">
                                    <span class="badge" th:classappend="${m.estado == 'NUEVO'} ? 'bg-warning text-dark' : 'bg-secondary'"
                                        th:text="${m.estado}">NUEVO</span>
                                </td>
                                <td class="text-center text-nowrap">
                                    <button type="button" class="btn btn-sm btn-outline-primary" title="Leer"
                                        th:data-nombre="${m.nombre}" th:data-correo="${m.correo}"
                                        th:data-telefono="${m.telefono}" th:data-mensaje="${m.mensaje}"
                                        th:data-fecha="${#temporals.format(m.fechaEnvio, 'dd/MM/yyyy HH:mm')}"
                                        onclick="verMensaje(this)">
                                        <i class="bi bi-envelope-open"></i></button>
                                    <form th:if="${m.estado == 'NUEVO'}"
                                        th:action="@{/ejecutivo/mensajes/leido/{id}(id=${m.idMensaje})}" method="post"
                                        class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-success" title="Marcar como leído">
                                            <i class="bi bi-check2-all"></i></button>
                                    </form>
                                    <form th:action="@{/ejecutivo/mensajes/eliminar/{id}(id=${m.idMensaje})}" method="post"
                                        class="d-inline" onsubmit="return confirm('¿Eliminar este mensaje?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                            <i class="bi bi-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(mensajes)}">
                                <td colspan="5" class="text-center text-muted py-4">No hay mensajes en ese rango de fechas.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL: lectura del mensaje completo -->
    <div class="modal fade" id="modalMensaje" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title"><i class="bi bi-envelope-open me-2 text-warning"></i>Consulta recibida</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-1"><strong id="mNombre"></strong> <span class="text-muted">· <span id="mFecha"></span></span></p>
                    <p class="small text-muted mb-3"><i class="bi bi-telephone me-1"></i><span id="mTelefono"></span></p>
                    <div id="mTexto" class="border rounded-3 p-3 bg-light" style="white-space: pre-wrap;"></div>
                </div>
                <div class="modal-footer">
                    <a id="mResponder" href="#" class="btn btn-primary"><i class="bi bi-reply me-1"></i>Responder por correo</a>
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/footer :: scripts}"></th:block>
    <script>
        const modalMensaje = new bootstrap.Modal(document.getElementById('modalMensaje'));
        function verMensaje(btn) {
            const d = btn.dataset;
            document.getElementById('mNombre').textContent = d.nombre + ' <' + d.correo + '>';
            document.getElementById('mFecha').textContent = d.fecha;
            document.getElementById('mTelefono').textContent = d.telefono || 'Sin teléfono';
            document.getElementById('mTexto').textContent = d.mensaje;
            document.getElementById('mResponder').href = 'mailto:' + d.correo + '?subject=' + encodeURIComponent('Respuesta a su consulta - Electrónica y Suministros');
            modalMensaje.show();
        }
    </script>
</body>

</html>
