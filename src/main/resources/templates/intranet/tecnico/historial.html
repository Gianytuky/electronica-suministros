<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/header :: head('Historial de capturas')}"></head>

<body class="bg-light">
    <div class="d-flex">
        <th:block th:replace="~{fragments/sidebar :: sidebar('historial')}"></th:block>

        <main class="flex-grow-1 p-4 overflow-auto" style="height: 100vh;">

            <div class="mb-4">
                <h2 class="fw-bold mb-0"><i class="bi bi-clock-history text-info me-2"></i>Historial de capturas</h2>
                <small class="text-muted">Últimas 25 mediciones registradas por el laboratorio (JOIN de 5 tablas).</small>
            </div>

            <div class="card shadow-sm border-0 rounded-4">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark small">
                            <tr>
                                <th>Fecha</th>
                                <th>OT</th>
                                <th>Formato</th>
                                <th class="text-center">Horas reales</th>
                                <th class="text-center">Peso (GB)</th>
                                <th>Medio de entrega</th>
                                <th>Técnico</th>
                                <th class="text-center">Estado de la OT</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${capturas}">
                                <td class="small text-nowrap" th:text="${c.fecha}">01/10/2026 10:00</td>
                                <td class="fw-bold" th:text="${c.codigoOt}">OT-1001</td>
                                <td th:text="${c.formato}">VHS</td>
                                <td class="text-center" th:text="${c.horas}">1.0</td>
                                <td class="text-center" th:text="${c.pesoGb}">2.5</td>
                                <td class="small" th:text="${c.medioEntrega}">USB</td>
                                <td class="small" th:text="${c.tecnico}">Técnico</td>
                                <td class="text-center">
                                    <span class="badge"
                                        th:classappend="${c.estadoOt == 'En Recepción'} ? 'bg-warning text-dark' : (${c.estadoOt == 'Por Notificar'} ? 'bg-info text-dark' : (${c.estadoOt == 'Finalizado'} ? 'bg-success' : 'bg-danger'))"
                                        th:text="${c.estadoOt}">Finalizado</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(capturas)}">
                                <td colspan="8" class="text-center text-muted py-4">Todavía no hay capturas registradas.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>

</html>
